<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Down</title>
    <style>
        /* Minimalist & Fast Loading */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #countdown {
            font-size: 2rem;
            font-family: 'Courier New', Courier, monospace;
            color: #aeaeae;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 15px 0;
            width: 300px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            padding-bottom: 100px;
        }

        .frame {
            background: #151515;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #222;
            transition: all 0.5s ease;
        }

        .frame:hover {
            border-color: #555;
            transform: scale(1.02);
        }

        .placeholder-text {
            color: #333;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        footer {
            margin-bottom: 40px;
            color: #444;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>MAY 09</h1>
        <div id="countdown">00:00:00:00</div>
    </div>

    <div class="gallery-grid">
        <div class="frame"><span class="placeholder-text">Coming Soon</span></div>
        <div class="frame"><span class="placeholder-text">Coming Soon</span></div>
        <div class="frame"><span class="placeholder-text">Coming Soon</span></div>
        <div class="frame"><span class="placeholder-text">Coming Soon</span></div>
        <div class="frame"><span class="placeholder-text">Coming Soon</span></div>
        <div class="frame"><span class="placeholder-text">Coming Soon</span></div>
    </div>

    <footer>Designed for May 9, 2026</footer>

    <script>
        // Set the date: May 9, 2026 00:00:00
        const targetDate = new Date('May 9, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result
            document.getElementById("countdown").innerHTML = 
                String(days).padStart(2, '0') + "d " + 
                String(hours).padStart(2, '0') + "h " + 
                String(minutes).padStart(2, '0') + "m " + 
                String(seconds).padStart(2, '0') + "s";

            // If the count down is finished
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "THE DAY IS HERE";
            }
        }

        // Run immediately then every second
        updateCountdown();
        const x = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
