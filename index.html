<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise - Saturday</title>
    <style>
        /* CSS الداخلي باش يخدم بسرعة حتى بإنترنت ضعيفة */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff0080, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #countdown {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: bold;
            color: #888;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            padding: 50px 0;
        }

        .photo-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .photo-card:hover {
            border-color: #ff0080;
            transform: translateY(-5px);
        }

        .coming-soon {
            color: #444;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Saturday Surprise</h1>
        <p>باقي من الزمن على يومك المميز:</p>
        <div id="countdown">تحميل العداد...</div>
    </div>

    <div class="gallery">
        <div class="photo-card"><span class="coming-soon">قريباً.. أول صورة</span></div>
        <div class="photo-card"><span class="coming-soon">قريباً.. ذكرى جديدة</span></div>
        <div class="photo-card"><span class="coming-soon">قريباً.. أجمل لقطة</span></div>
    </div>

    <script>
        // تحديد تاريخ يوم السبت القادم (9 ماي 2026)
        const targetDate = new Date('May 9, 2026 00:00:00').getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = 
                days + " يوم و " + hours + ":" + minutes + ":" + seconds;

            if (diff < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "اليوم هو اليوم المنشود! 🎉";
            }
        }, 1000);
    </script>
</body>
</html>
